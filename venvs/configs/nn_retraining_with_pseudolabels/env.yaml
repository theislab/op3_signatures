# task_perturbation_prediction src/methods/nn_retraining_with_pseudolabels/config.vsh.yaml: image base_tensorflow_nvidia:1.0.0,
# setup: scikit-learn==1.3.2, fastparquet. Base has TensorFlow, anndata~=0.11.0. We pin tensorflow~=2.16.1, add tf_keras.
name: nn_retraining_with_pseudolabels
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.10.6
  - numpy
  - pandas
  - pip
  - pip:
    - tensorflow~=2.16.1
    - anndata~=0.11.0
    - tf_keras
    - scikit-learn==1.3.2
    - fastparquet
    - rdkit==2025.03.1
