# task_perturbation_prediction src/methods/lgc_ensemble_direct/config.vsh.yaml: image base_pytorch_nvidia:1.0.0,
# setup: torch==2.1.1 (cu121), fastparquet, pandas==2.1.3, pyarrow==14.0.1, tqdm==4.66.1, scikit-learn==1.3.2,
# transformers==4.35.2, matplotlib==3.8.2, torch-summary. Base has anndata~=0.11.0.
name: lgc_ensemble
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python==3.10
  - numpy
  - scipy
  - pytorch::pytorch=2.1.1
  - pytorch::pytorch-cuda=12.1
  - pytorch::torchvision
  - pip
  - pip:
    - anndata~=0.11.0
    - fastparquet
    - pandas==2.1.3
    - pyarrow==14.0.1
    - tqdm==4.66.1
    - scikit-learn==1.3.2
    - transformers==4.35.2
    - matplotlib==3.8.2
    - torch-summary
