# task_perturbation_prediction src/methods/pyboost/config.vsh.yaml: image base_pytorch_nvidia:1.0.0,
# setup: colorama, py-boost==0.4.3. Base has anndata~=0.11.0. We add cupy-cuda12x for GPU.
name: pyboost
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - colorama
  - pip
  - pip:
    - cupy-cuda12x
    - py-boost==0.4.3
    - anndata~=0.11.0