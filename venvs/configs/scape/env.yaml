# task_perturbation_prediction src/methods/scape/config.vsh.yaml: image base_tensorflow_nvidia:1.0.0.
# Pin scape to release 0.1.0 (Kaggle competition version) to avoid dependency conflicts from main.
name: scape
channels:
  - conda-forge
  - defaults
dependencies:
  - python==3.10.6
  - numpy
  - pip
  - pip:
    - anndata~=0.11.0
    - tensorflow~=2.14.0
    - tensorflow-io-gcs-filesystem>=0.31.0
    - pandas~=1.5.3
    - scikit-learn~=1.2.2
    - fastparquet~=2023.10.1
    - git+https://github.com/scapeML/scape.git@0.1.0
